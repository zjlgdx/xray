name: Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    # Path filtering: Skip tests for documentation-only changes
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Concurrency: Cancel in-progress runs when new commits are pushed
# This prevents redundant CI runs and saves GitHub Actions minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions (minimal permissions for security)
# Increase permissions only when specific jobs require it
permissions:
  contents: read     # Read repository contents
  actions: write     # Required for actions/upload-artifact

env:
  # Cache apt payloads in workspace to avoid permission issues restoring /var/cache/apt.
  APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt/archives

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Cache apt packages
        id: cache-apt
        # actions/cache@v5.0.3 (pinned to commit SHA for security)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Cache only .deb payloads in a user-writable directory.
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-shellcheck-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            apt-shellcheck-${{ runner.os }}-

      - name: Install ShellCheck
        run: |
          bash scripts/ci/apt-resilient.sh shellcheck

      - name: Run ShellCheck
        run: make lint

  format-check:
    name: Format Check (shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Cache shfmt binary
        id: cache-shfmt
        # actions/cache@v5.0.3 (pinned to commit SHA for security)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/bin/shfmt
          key: shfmt-v3.12.0-${{ runner.os }}

      - name: Install shfmt
        if: steps.cache-shfmt.outputs.cache-hit != 'true'
        run: |
          # Download shfmt v3.12.0 with checksum verification
          mkdir -p ~/.local/bin
          wget https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -O ~/.local/bin/shfmt
          echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $HOME/.local/bin/shfmt" | sha256sum -c -
          chmod +x ~/.local/bin/shfmt

      - name: Add shfmt to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'bin/*' 'commands/*' 'lib/*' 'modules/**/*' 'services/**/*' 'scripts/**/*.sh' 2>/dev/null)
          if ((${#files[@]} > 0)); then
            shfmt -i 2 -ci -sr -bn -ln=bash -d "${files[@]}"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    timeout-minutes: 15
    strategy:
      matrix:
        # OPTIMIZED: Test on currently supported LTS runners
        # Rationale: ubuntu-20.04 is no longer listed for GitHub-hosted runners
        ubuntu-version: ['22.04', '24.04']
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Cache apt packages
        id: cache-apt-bats
        # actions/cache@v5.0.3 (pinned to commit SHA for security)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Cache only .deb payloads in a user-writable directory.
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-bats-${{ runner.os }}-${{ matrix.ubuntu-version }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            apt-bats-${{ runner.os }}-${{ matrix.ubuntu-version }}-

      - name: Install bats-core
        run: |
          bash scripts/ci/apt-resilient.sh curl tar
          BATS_VERSION="v1.13.0"
          tmpdir="$(mktemp -d)"
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" | tar -xz -C "${tmpdir}"
          sudo "${tmpdir}/bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          rm -rf "${tmpdir}"
          bats -v

      - name: Run unit tests
        run: |
          mkdir -p artifacts/unit
          bats --print-output-on-failure \
            --report-formatter junit \
            --output artifacts/unit \
            tests/unit/*.bats

      - name: Upload test results
        if: always()
        # actions/upload-artifact@v7.0.0 (pinned to commit SHA for security)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.ubuntu-version }}
          path: artifacts/unit/*.xml
          retention-days: 3  # OPTIMIZED: 7 → 3 days (sufficient for debugging)

  integration-tests:
    name: Integration Tests (Sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # IMPROVED: Run on all pushes and PRs (not just PRs)
    # Rationale: 13/21 (62%) tests are runnable, providing valuable feedback
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Cache apt packages
        id: cache-apt-integration
        # actions/cache@v5.0.3 (pinned to commit SHA for security)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Cache only .deb payloads in a user-writable directory.
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: apt-integration-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            apt-integration-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bash scripts/ci/apt-resilient.sh curl tar unzip
          BATS_VERSION="v1.13.0"
          tmpdir="$(mktemp -d)"
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" | tar -xz -C "${tmpdir}"
          sudo "${tmpdir}/bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          rm -rf "${tmpdir}"
          bats -v

      - name: Run integration tests
        run: |
          mkdir -p artifacts/integration
          bats --print-output-on-failure \
            --report-formatter junit \
            --output artifacts/integration \
            tests/integration/*.bats

      - name: Upload integration test results
        if: always()
        # actions/upload-artifact@v7.0.0 (pinned to commit SHA for security)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-results
          path: artifacts/integration/*.xml
          retention-days: 3

  coverage:
    name: Real Shell Coverage (kcov)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [unit-tests]
    outputs:
      unit_percent: ${{ steps.unit-coverage.outputs.unit_percent }}
      unit_threshold: ${{ steps.unit-coverage.outputs.unit_threshold }}
      integration_status: ${{ steps.integration-status.outputs.integration_status }}
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install coverage dependencies
        run: |
          bash scripts/ci/apt-resilient.sh ca-certificates curl tar python3 jq \
            cmake g++ pkg-config libdw-dev libelf-dev libiberty-dev \
            libcurl4-openssl-dev zlib1g-dev binutils-dev

      - name: Install bats-core
        run: |
          BATS_VERSION="v1.13.0"
          tmpdir="$(mktemp -d)"
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" | tar -xz -C "${tmpdir}"
          sudo "${tmpdir}/bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          rm -rf "${tmpdir}"
          bats -v

      - name: Cache kcov binary
        id: cache-kcov
        # actions/cache@v5.0.3 (pinned to commit SHA for security)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Cache in user-writable directory to avoid tar permission errors
          # when restoring to root-owned /usr/local/bin (exit code 2).
          path: ~/.local/bin/kcov
          key: kcov-v42-built-${{ runner.os }}-${{ runner.arch }}

      - name: Build kcov from source
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          KCOV_VERSION="v42"
          tmpdir="$(mktemp -d)"
          curl -fsSL "https://github.com/SimonKagstrom/kcov/archive/refs/tags/${KCOV_VERSION}.tar.gz" | tar -xz -C "${tmpdir}"
          cd "${tmpdir}/kcov-${KCOV_VERSION#v}"
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j"$(nproc)"
          sudo make install
          rm -rf "${tmpdir}"
          # Copy built binary to user-writable cache path
          mkdir -p ~/.local/bin
          cp /usr/local/bin/kcov ~/.local/bin/kcov

      - name: Install kcov from cache
        if: steps.cache-kcov.outputs.cache-hit == 'true'
        run: |
          sudo cp ~/.local/bin/kcov /usr/local/bin/kcov
          sudo chmod +x /usr/local/bin/kcov

      - name: Verify kcov
        run: |
          kcov --version
          ldd "$(command -v kcov)" | grep -c "not found" && { echo "Missing shared libraries"; exit 1; } || true

      - name: Run tests under kcov
        id: kcov-run
        run: |
          mkdir -p artifacts/coverage/unit
          # kcov may exit non-zero due to DEBUG trap conflicts with bats;
          # capture exit code but continue to process coverage data.
          kcov_rc=0
          kcov --bash-dont-parse-binary-dir \
            --include-path="${GITHUB_WORKSPACE}/lib,${GITHUB_WORKSPACE}/commands,${GITHUB_WORKSPACE}/modules,${GITHUB_WORKSPACE}/services,${GITHUB_WORKSPACE}/bin" \
            --exclude-path=/tmp \
            artifacts/coverage/unit \
            bats tests/unit/*.bats || kcov_rc=$?
          echo "kcov exit code: ${kcov_rc}"
          echo "kcov_rc=${kcov_rc}" >> "${GITHUB_OUTPUT}"

      - name: Parse unit coverage
        id: unit-coverage
        run: |
          echo "--- kcov output structure ---"
          find artifacts/coverage/unit -name "coverage.json" | head -10

          json_file="$(find artifacts/coverage/unit -name coverage.json -path "*/kcov-merged/*" | head -n1)"
          if [[ -z "${json_file}" ]]; then
            json_file="$(find artifacts/coverage/unit -name coverage.json | head -n1)"
          fi
          if [[ -z "${json_file}" ]]; then
            echo "coverage.json not found in artifacts/coverage/unit" >&2
            find artifacts/coverage/unit -type f | head -20
            exit 1
          fi
          echo "Using: ${json_file}"
          python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          print("Total percent_covered:", data.get("percent_covered", "N/A"))
          files = data.get("files", [])
          print("Files tracked:", len(files))
          for entry in files[:10]:
              name = entry.get("filename", "?")
              pct = entry.get("percent_covered", "?")
              print("  %s: %s%%" % (name, pct))
          ' "${json_file}"

          unit_percent="$(python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          print("{:.2f}".format(float(data["percent_covered"])))
          ' "${json_file}")"
          unit_threshold="$(tr -d '[:space:]' < .github/coverage/unit-threshold.txt)"

          echo "unit_percent=${unit_percent}" >> "${GITHUB_OUTPUT}"
          echo "unit_threshold=${unit_threshold}" >> "${GITHUB_OUTPUT}"

      - name: Enforce unit coverage threshold
        run: |
          python3 -c '
          import sys
          actual = float(sys.argv[1])
          threshold = float(sys.argv[2])
          if actual < threshold:
              print("Unit coverage gate failed: {:.2f}% < {:.2f}%".format(actual, threshold))
              raise SystemExit(1)
          print("Unit coverage gate passed: {:.2f}% >= {:.2f}%".format(actual, threshold))
          ' "${{ steps.unit-coverage.outputs.unit_percent }}" "${{ steps.unit-coverage.outputs.unit_threshold }}"

      - name: Collect integration coverage (non-gating)
        id: integration-coverage-run
        continue-on-error: true
        run: |
          mkdir -p artifacts/coverage/integration
          kcov --bash-dont-parse-binary-dir \
            --include-path="${GITHUB_WORKSPACE}/lib,${GITHUB_WORKSPACE}/commands,${GITHUB_WORKSPACE}/modules,${GITHUB_WORKSPACE}/services,${GITHUB_WORKSPACE}/bin" \
            --exclude-path=/tmp \
            artifacts/coverage/integration \
            bats tests/integration/*.bats || true

      - name: Record integration coverage status
        id: integration-status
        if: always()
        run: |
          echo "integration_status=${{ steps.integration-coverage-run.outcome }}" >> "${GITHUB_OUTPUT}"

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## 📊 Real Shell Coverage (kcov)"
            echo ""
            echo "- Unit coverage: ${{ steps.unit-coverage.outputs.unit_percent }}%"
            echo "- Unit threshold: ${{ steps.unit-coverage.outputs.unit_threshold }}%"
            echo "- Integration coverage status: ${{ steps.integration-status.outputs.integration_status }} (non-gating)"
            echo ""
            echo "Artifacts:"
            echo "- \`artifacts/coverage/unit/**\`"
            echo "- \`artifacts/coverage/integration/**\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage artifacts
        if: always()
        # actions/upload-artifact@v7.0.0 (pinned to commit SHA for security)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-results
          path: artifacts/coverage/**
          if-no-files-found: warn
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2 (pinned to commit SHA for security)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run ShellCheck security checks
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'bin/*' 'commands/*' 'lib/*' 'modules/**/*' 'services/**/*' 'scripts/**/*.sh' 2>/dev/null)
          if ((${#files[@]} > 0)); then
            shellcheck -S error -f json "${files[@]}" > shellcheck-report.json || true
          else
            printf '[]\n' > shellcheck-report.json
          fi

      - name: Upload security report
        if: always()
        # actions/upload-artifact@v7.0.0 (pinned to commit SHA for security)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-report
          path: shellcheck-report.json
          retention-days: 14  # OPTIMIZED: 30 → 14 days (compliance requirement)

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, format-check, unit-tests, integration-tests, coverage, security-scan]
    if: always()  # Run even if some jobs fail
    steps:
      - name: Generate workflow summary
        run: |
          {
            echo "## 🎯 CI/CD Workflow Execution Summary"
            echo ""
            echo "| Job | Status | Notes |"
            echo "|-----|--------|-------|"
            echo "| Lint (ShellCheck) | ${{ needs.lint.result }} | Static analysis |"
            echo "| Format Check (shfmt) | ${{ needs.format-check.result }} | Code formatting |"
            echo "| Unit Tests | ${{ needs.unit-tests.result }} | 108 tests across 2 Ubuntu versions |"
            echo "| Integration Tests | ${{ needs.integration-tests.result }} | 13/21 runnable tests |"
            echo "| Coverage Summary | ${{ needs.coverage.result }} | unit=${{ needs.coverage.outputs.unit_percent }}% (threshold=${{ needs.coverage.outputs.unit_threshold }}%), integration=${{ needs.coverage.outputs.integration_status }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} | ShellCheck report |"
            echo ""
            echo "### 📊 Workflow Details"
            echo "- **Trigger**: ${{ github.event_name }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- **Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "---"
            echo "*Optimized with Phase 1-4 improvements: caching, concurrency control, path filtering*"
          } >> "$GITHUB_STEP_SUMMARY"
